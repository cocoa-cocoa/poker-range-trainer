<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Poker Range Trainer</title>
<style>
:root{--bg:#f4f6f8;--ink:#18212f;--border:#cbd5e1;--allin:#ef4444;--raise:#f59e0b;--call:#3b82f6;--fold:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{touch-action:manipulation}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#18212f;color:#fff;padding:13px 12px;position:sticky;top:0;z-index:20}.wrap{max-width:1080px;margin:auto}nav{margin-top:9px}nav button,.btn{margin:2px;padding:10px 13px;border:0;border-radius:8px;background:#fff;color:#18212f;font-weight:700;font-size:15px;cursor:pointer}
main{padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;max-width:100%}
.actions button{padding:10px 13px;margin:3px;border:0;border-radius:8px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.allin{background:var(--allin)}.raise{background:var(--raise)}.call{background:var(--call)}.fold{background:var(--fold)}.mixmode{background:#7c3aed!important}.activeMode{outline:3px solid #111827}.help{color:#64748b;font-size:14px}
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#fff}.grid{display:grid;grid-template-columns:repeat(13,54px);gap:3px;padding:4px;min-width:max-content}
.cell{height:50px;width:54px;border:1px solid #94a3b8;border-radius:6px;background:#fff;font-weight:800;white-space:pre-line;line-height:1.05;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation}.cell.Fold{background:#e2e8f0}.cell.Raise{background:#fde68a}.cell.Call{background:#bfdbfe}.cell.All-in{background:#fecaca}.cell.mix{background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}.cell.mix::after{content:"50/50";position:absolute;right:2px;bottom:2px;font-size:9px;color:#111827aa;font-weight:900}
/* v2以前の通常境界に戻し、ポケットだけ太く */.cell.pair{border:4px solid #475569}.cell.correct{outline:3px solid #22c55e;z-index:2}.cell.wrong{outline:3px solid #ef4444;z-index:2}.bigHand{text-align:center;font-size:48px;font-weight:900;padding:25px}#result{font-size:20px;font-weight:800;margin:12px 0}
.rangeItem{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #e5e7eb}.rangeName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.menuWrap{position:relative}.menuBtn{width:38px;height:38px;border:0;border-radius:8px;background:#eef2f7;font-size:21px;cursor:pointer}.menu{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 5px 18px #0003;z-index:30;min-width:120px;padding:4px}.menu button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:10px;border-radius:6px;font-size:15px}.menu button:hover{background:#f1f5f9}
.previewBox{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:14px;overflow:auto}.previewTitle{font-size:14px;font-weight:800;margin-bottom:7px}.previewGrid{display:grid;grid-template-columns:repeat(13,24px);gap:1px;width:max-content}.previewCell{width:24px;height:24px;border:1px solid #94a3b8;font-size:7px;font-weight:800;display:flex;align-items:center;justify-content:center;position:relative}.previewCell.Fold{background:#e2e8f0}.previewCell.Raise{background:#fde68a}.previewCell.Call{background:#bfdbfe}.previewCell.All-in{background:#fecaca}.previewCell.mix{background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%)}.previewCell.pair{border:2px solid #475569}.previewCell.target::after{content:"●";position:absolute;font-size:20px;color:#111;text-shadow:0 0 2px #fff}
#choiceStatus{font-weight:700}@media(max-width:600px){main{padding:9px}.card{padding:12px}.grid{grid-template-columns:repeat(13,52px)}.cell{width:52px;height:48px}.previewGrid{grid-template-columns:repeat(13,21px)}.previewCell{width:21px;height:21px;font-size:6px}}
</style>
</head>
<body>
<header><div class="wrap"><b>🃏 Poker Range Trainer</b><nav><button onclick="showPage('home')">ホーム</button><button onclick="newRange()">レンジ作成</button><button onclick="showPage('quiz')">学習モード</button><button onclick="showPage('memory')">169マス暗記</button></nav></div></header>
<main class="wrap">
<section id="home" class="page card"><h2>ポーカー ハンドレンジ学習</h2><p>169ハンドのレンジを作成・保存し、クイズと暗記モードで練習できます。</p><button class="btn" onclick="newRange()">＋ 新しいレンジを作成</button><h3>保存済みレンジ</h3><div id="rangeList"></div></section>
<section id="editor" class="page card hidden"><h2>レンジ作成 / 編集</h2><div class="row"><input id="rangeName" placeholder="例：BTN Open"><button class="btn" onclick="saveRange()">💾 保存</button><button class="btn" onclick="showPage('home')">戻る</button></div><p class="help">新規レンジは全169マスが最初からFoldです。通常は上書き、混合モードは次の1回だけ2色50/50にします。</p><div class="actions"><button class="allin" onclick="setAction('All-in')">All-in</button><button class="raise" onclick="setAction('Raise')">Raise</button><button class="call" onclick="setAction('Call')">Call</button><button class="fold" onclick="setAction('Fold')">Fold</button><button id="mixBtn" class="mixmode" onclick="toggleMix()">🎨 2色塗り（次の1回だけ）</button></div><p>選択中：<b id="selectedAction">Raise</b> <span id="mixStatus"></span></p><div class="gridwrap"><div id="editorGrid" class="grid"></div></div><div id="editorPreview"></div></section>
<section id="quiz" class="page card hidden"><h2>学習モード</h2><div class="row"><select id="quizRange" onchange="startQuiz()"></select><button class="btn" onclick="startQuiz()">開始</button></div><div id="quizArea" class="hidden"><div id="quizHand" class="bigHand"></div><div class="actions"><button class="allin" onclick="answerQuiz('All-in')">All-in</button><button class="raise" onclick="answerQuiz('Raise')">Raise</button><button class="call" onclick="answerQuiz('Call')">Call</button><button class="fold" onclick="answerQuiz('Fold')">Fold</button><button id="quizMixBtn" class="mixmode" onclick="toggleQuizMix()">🎨 混合戦略</button></div><div id="mixChoices" class="hidden"><p><b>4種から2つのアクションを選択：</b></p><div class="actions"><button class="allin" onclick="toggleQuizChoice('All-in')">All-in</button><button class="raise" onclick="toggleQuizChoice('Raise')">Raise</button><button class="call" onclick="toggleQuizChoice('Call')">Call</button><button class="fold" onclick="toggleQuizChoice('Fold')">Fold</button></div><p id="choiceStatus"></p><button class="btn" onclick="submitMixAnswer()">混合戦略で回答</button></div><div id="result"></div><div id="quizPreview"></div><button id="nextBtn" class="btn hidden" onclick="nextQuestion()">次の問題</button></div><p id="quizEmpty">保存済みレンジを選択してください。</p></section>
<section id="memory" class="page card hidden"><h2>169マス暗記モード</h2><div class="row"><select id="memoryRange" onchange="startMemory()"></select><button class="btn" onclick="startMemory()">開始 / リセット</button><button class="btn" onclick="checkMemory()">答え合わせ</button></div><p class="help">暗記モードも最初から全マスFold。通常は上書き、混合モードは次の1回だけ2色50/50です。</p><div class="actions"><button class="allin" onclick="setMemoryAction('All-in')">All-in</button><button class="raise" onclick="setMemoryAction('Raise')">Raise</button><button class="call" onclick="setMemoryAction('Call')">Call</button><button class="fold" onclick="setMemoryAction('Fold')">Fold</button><button id="memoryMixBtn" class="mixmode" onclick="toggleMemoryMix()">🎨 2色塗り（次の1回だけ）</button></div><p>選択中：<b id="memorySelected">Raise</b> <span id="memoryMixStatus"></span></p><div id="memoryResult"></div><div class="gridwrap"><div id="memoryGrid" class="grid"></div></div><div id="memoryPreview"></div></section>
</main>
<script>
const R=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const KEY='pokerRangeTrainer_v3';
let ranges=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('pokerRangeTrainer_v2')||localStorage.getItem('pokerRangeTrainer_v1')||'[]');
let current={id:null,name:'',hands:{}},selected='Raise',mixOnce=false,q=null,quizMix=false,quizChoices=[],memoryAction='Raise',memoryMixOnce=false,memoryAnswers={};
function handList(){let a=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)a.push(i===j?R[i]+R[j]:i<j?R[i]+R[j]+'s':R[j]+R[i]+'o');return a}
function defaultHands(){let h={};handList().forEach(x=>h[x]='Fold');return h}
function normalizeHands(h){let d=defaultHands();Object.keys(h||{}).forEach(k=>d[k]=h[k]);return d}
function isMix(v){return typeof v==='object'&&v&&Array.isArray(v.mix)&&v.mix.length===2}
function typeClass(h){return h.length===2?'pair':''}
function colorFor(a){return ({'All-in':'#fecaca','Raise':'#fde68a','Call':'#bfdbfe','Fold':'#e2e8f0'})[a]||'#fff'}
function actionText(v){return isMix(v)?v.mix.join(' / ')+'（50/50）':v}
function sameActions(a,b){return a.length===2&&b.length===2&&a.every(x=>b.includes(x))&&b.every(x=>a.includes(x))}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='home')renderList();if(id==='quiz'||id==='memory')fillSelects()}
function newRange(){current={id:null,name:'',hands:defaultHands()};selected='Raise';mixOnce=false;document.getElementById('rangeName').value='';updateEditorStatus();renderEditor();showPage('editor')}
function setAction(a){selected=a;mixOnce=false;updateEditorStatus()}function toggleMix(){mixOnce=!mixOnce;updateEditorStatus()}function updateEditorStatus(){selectedAction.textContent=selected;mixStatus.textContent=mixOnce?'＋ 次の1マスだけ2色50/50':'';mixBtn.classList.toggle('activeMode',mixOnce)}
function applyCellStyle(b,v,small=false){b.className=(small?'previewCell':'cell')+' '+typeClass(b.dataset.hand);b.style.removeProperty('--c1');b.style.removeProperty('--c2');if(isMix(v)){b.classList.add('mix');b.style.setProperty('--c1',colorFor(v.mix[0]));b.style.setProperty('--c2',colorFor(v.mix[1]));b.title=actionText(v)}else{b.classList.add(v||'Fold');b.title=v||'Fold'}}
function renderPreview(container,hands,target=null,title='レンジプレビュー'){container.innerHTML='';let box=document.createElement('div');box.className='previewBox';let tt=document.createElement('div');tt.className='previewTitle';tt.textContent=title;box.appendChild(tt);let g=document.createElement('div');g.className='previewGrid';handList().forEach(h=>{let d=document.createElement('div');d.dataset.hand=h;applyCellStyle(d,hands[h]||'Fold',true);d.textContent=h;if(h===target)d.classList.add('target');g.appendChild(d)});box.appendChild(g);container.appendChild(box)}
function renderEditor(){let g=editorGrid;g.innerHTML='';handList().forEach(h=>{let b=document.createElement('button');b.dataset.hand=h;b.textContent=h;applyCellStyle(b,current.hands[h]);b.onclick=()=>{if(mixOnce){let old=current.hands[h],first=isMix(old)?old.mix[0]:old;current.hands[h]={mix:[first,selected]};mixOnce=false;updateEditorStatus()}else current.hands[h]=selected;renderEditor()};g.appendChild(b)});renderPreview(editorPreview,current.hands)}
function saveRange(){let n=rangeName.value.trim();if(!n)return alert('レンジ名を入力してください');current.name=n;current.hands=normalizeHands(current.hands);if(!current.id)current.id=Date.now().toString();let i=ranges.findIndex(x=>x.id===current.id),copy=JSON.parse(JSON.stringify(current));if(i>=0)ranges[i]=copy;else ranges.push(copy);localStorage.setItem(KEY,JSON.stringify(ranges));alert('保存しました');showPage('home')}
function renderList(){let d=rangeList;if(!ranges.length){d.textContent='まだ保存されたレンジはありません。';return}d.innerHTML='';ranges.forEach(r=>{let x=document.createElement('div');x.className='rangeItem';let n=document.createElement('div');n.className='rangeName';n.textContent=r.name;let w=document.createElement('div');w.className='menuWrap';let mb=document.createElement('button');mb.className='menuBtn';mb.textContent='⋮';let menu=document.createElement('div');menu.className='menu hidden';[['編集',()=>editRange(r)],['名前変更',()=>renameRange(r)],['削除',()=>deleteRange(r)]].forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=(e)=>{e.stopPropagation();fn()};menu.appendChild(b)});mb.onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu').forEach(m=>{if(m!==menu)m.classList.add('hidden')});menu.classList.toggle('hidden')};w.append(mb,menu);x.append(n,w);d.appendChild(x)})}
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.add('hidden')));
function editRange(r){current=JSON.parse(JSON.stringify(r));current.hands=normalizeHands(current.hands);rangeName.value=current.name;selected='Raise';mixOnce=false;updateEditorStatus();renderEditor();showPage('editor')}
function renameRange(r){let n=prompt('新しい名前',r.name);if(n&&n.trim()){r.name=n.trim();localStorage.setItem(KEY,JSON.stringify(ranges));renderList()}}
function deleteRange(r){if(confirm('削除しますか？')){ranges=ranges.filter(z=>z.id!==r.id);localStorage.setItem(KEY,JSON.stringify(ranges));renderList()}}
function fillSelects(){for(const id of ['quizRange','memoryRange']){let s=document.getElementById(id),v=s.value;s.innerHTML='';if(!ranges.length){let o=document.createElement('option');o.textContent='保存済みレンジなし';o.value='';s.appendChild(o)}ranges.forEach(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=r.name;s.appendChild(o)});if(v&&ranges.some(r=>r.id===v))s.value=v}}
function getRange(id){return ranges.find(r=>r.id===id)}
function startQuiz(){let r=getRange(quizRange.value);if(!r){quizArea.classList.add('hidden');return}r.hands=normalizeHands(r.hands);q={range:r};quizArea.classList.remove('hidden');quizEmpty.textContent='';nextQuestion()}
function nextQuestion(){q.hand=handList()[Math.floor(Math.random()*169)];q.done=false;quizMix=false;quizChoices=[];quizMixBtn.classList.remove('activeMode');mixChoices.classList.add('hidden');choiceStatus.textContent='';result.textContent='';quizPreview.innerHTML='';nextBtn.classList.add('hidden');quizHand.textContent=q.hand}
function answerQuiz(a){if(!q||q.done)return;let v=q.range.hands[q.hand]||'Fold';if(isMix(v)){result.textContent='⚠️ このハンドは混合戦略です。「🎨 混合戦略」から2つ選択してください。';return}finishQuiz(a===v,'あなたの回答：'+a,actionText(v))}
function toggleQuizMix(){if(!q||q.done)return;quizMix=!quizMix;quizChoices=[];quizMixBtn.classList.toggle('activeMode',quizMix);mixChoices.classList.toggle('hidden',!quizMix);choiceStatus.textContent='2つ選択してください（0 / 2）'}
function toggleQuizChoice(a){if(quizChoices.includes(a))quizChoices=quizChoices.filter(x=>x!==a);else if(quizChoices.length<2)quizChoices.push(a);else{alert('選べるのは2つまでです');return}choiceStatus.textContent='選択中：'+(quizChoices.join(' / ')||'なし')+'（'+quizChoices.length+' / 2）'}
function submitMixAnswer(){if(!q||q.done)return;if(quizChoices.length!==2){alert('2つのアクションを選択してください');return}let v=q.range.hands[q.hand]||'Fold',ok=isMix(v)&&sameActions(quizChoices,v.mix);finishQuiz(ok,'あなたの回答：'+quizChoices.join(' / '),actionText(v))}
function finishQuiz(ok,your,correct){q.done=true;result.textContent=(ok?'✅ 正解！ ':'❌ 不正解。 ')+your+' ／ 正解：'+correct;if(!ok)renderPreview(quizPreview,q.range.hands,q.hand,'間違えたハンドの位置（●）');nextBtn.classList.remove('hidden')}
function setMemoryAction(a){memoryAction=a;memoryMixOnce=false;memorySelected.textContent=a;updateMemoryMixStatus()}function toggleMemoryMix(){memoryMixOnce=!memoryMixOnce;updateMemoryMixStatus()}function updateMemoryMixStatus(){memoryMixStatus.textContent=memoryMixOnce?'＋ 次の1マスだけ2色50/50':'';memoryMixBtn.classList.toggle('activeMode',memoryMixOnce)}
function startMemory(){memoryAnswers=defaultHands();memoryMixOnce=false;memoryAction='Raise';memorySelected.textContent='Raise';updateMemoryMixStatus();memoryResult.textContent='';let g=memoryGrid;g.innerHTML='';handList().forEach(h=>{let b=document.createElement('button');b.dataset.hand=h;b.textContent=h;applyCellStyle(b,'Fold');b.onclick=()=>{if(memoryMixOnce){let old=memoryAnswers[h],first=isMix(old)?old.mix[0]:old;memoryAnswers[h]={mix:[first,memoryAction]};memoryMixOnce=false;updateMemoryMixStatus()}else memoryAnswers[h]=memoryAction;applyCellStyle(b,memoryAnswers[h]);renderPreview(memoryPreview,memoryAnswers)};g.appendChild(b)});renderPreview(memoryPreview,memoryAnswers)}
function checkMemory(){let r=getRange(memoryRange.value);if(!r)return;r.hands=normalizeHands(r.hands);let correct=0,cells=[...document.querySelectorAll('#memoryGrid .cell')];handList().forEach((h,i)=>{let exp=r.hands[h]||'Fold',act=memoryAnswers[h]||'Fold',ok=isMix(exp)?(isMix(act)&&sameActions(act.mix,exp.mix)):(!isMix(act)&&act===exp);cells[i].classList.remove('correct','wrong');cells[i].classList.add(ok?'correct':'wrong');cells[i].title=ok?'正解':'正解：'+actionText(exp);if(ok)correct++});memoryResult.textContent='正答率：'+correct+' / 169（'+(correct/169*100).toFixed(1)+'%）'}
renderList();
</script></body></html>
