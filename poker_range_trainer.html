<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poker Range Trainer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#18212f}
header{background:#18212f;color:white;padding:14px;position:sticky;top:0;z-index:10}.wrap{max-width:1050px;margin:auto}
nav button,.btn{margin:3px;padding:10px 14px;border:0;border-radius:8px;background:white;color:#18212f;font-weight:700;cursor:pointer}
main{padding:18px}.card{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
.hidden{display:none}.actions button{padding:9px;margin:3px;border:0;border-radius:7px;color:white;font-weight:bold;cursor:pointer}
.allin{background:#dc2626}.raise{background:#d97706}.call{background:#2563eb}.fold{background:#64748b}
input,select{padding:10px;border:1px solid #ccd3dd;border-radius:7px;font-size:16px}
.gridwrap{overflow:auto}.grid{display:grid;grid-template-columns:repeat(13,minmax(46px,1fr));gap:3px;min-width:650px}
.cell{height:48px;border:1px solid #ccd3dd;border-radius:6px;background:white;font-weight:700;cursor:pointer}
.cell.All-in{background:#fecaca}.cell.Raise{background:#fde68a}.cell.Call{background:#bfdbfe}.cell.Fold{background:#e2e8f0}
.cell.correct{outline:3px solid #22c55e}.cell.wrong{outline:3px solid #ef4444}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bigHand{text-align:center;font-size:48px;font-weight:800;padding:25px}
#result{font-size:20px;font-weight:bold;margin:12px 0}@media(max-width:600px){main{padding:10px}.card{padding:12px}}
</style>
</head>
<body>
<header><div class="wrap"><b>🃏 Poker Range Trainer</b><nav>
<button onclick="show('home')">ホーム</button><button onclick="newRange()">レンジ作成</button>
<button onclick="show('quiz')">学習モード</button><button onclick="show('memory')">169マス暗記</button>
</nav></div></header>
<main class="wrap">

<section id="home" class="page card">
<h2>ポーカー ハンドレンジ学習</h2><p>169ハンドのレンジを作成・保存し、クイズと暗記モードで練習できます。</p>
<button class="btn" onclick="newRange()">＋ 新しいレンジを作成</button>
<h3>保存済みレンジ</h3><div id="rangeList"></div>
</section>

<section id="editor" class="page card hidden">
<h2>レンジ作成 / 編集</h2>
<div class="row"><input id="rangeName" placeholder="例：BTN Open"><button class="btn" onclick="saveRange()">💾 保存</button><button class="btn" onclick="show('home')">戻る</button></div>
<p>アクションを選択してからマスをタップしてください。</p>
<div class="actions">
<button class="allin" onclick="setAction('All-in')">All-in</button><button class="raise" onclick="setAction('Raise')">Raise</button>
<button class="call" onclick="setAction('Call')">Call</button><button class="fold" onclick="setAction('Fold')">Fold</button>
</div><p>選択中：<b id="selectedAction">Raise</b></p>
<div class="gridwrap"><div id="editorGrid" class="grid"></div></div>
</section>

<section id="quiz" class="page card hidden">
<h2>学習モード</h2><div class="row"><select id="quizRange" onchange="startQuiz()"></select><button class="btn" onclick="startQuiz()">開始</button></div>
<div id="quizArea" class="hidden"><div id="quizHand" class="bigHand"></div>
<div class="actions"><button class="allin" onclick="answer('All-in')">All-in</button><button class="raise" onclick="answer('Raise')">Raise</button><button class="call" onclick="answer('Call')">Call</button><button class="fold" onclick="answer('Fold')">Fold</button></div>
<div id="result"></div><button id="nextBtn" class="btn hidden" onclick="nextQuestion()">次の問題</button></div>
<p id="quizEmpty">保存済みレンジを選択してください。</p>
</section>

<section id="memory" class="page card hidden">
<h2>169マス暗記モード</h2><div class="row"><select id="memoryRange" onchange="startMemory()"></select><button class="btn" onclick="startMemory()">開始</button><button class="btn" onclick="checkMemory()">答え合わせ</button></div>
<p>アクションを選択してから、記憶を頼りに169マスを埋めます。</p>
<div class="actions"><button class="allin" onclick="setMemoryAction('All-in')">All-in</button><button class="raise" onclick="setMemoryAction('Raise')">Raise</button><button class="call" onclick="setMemoryAction('Call')">Call</button><button class="fold" onclick="setMemoryAction('Fold')">Fold</button></div>
<div id="memoryResult"></div><div class="gridwrap"><div id="memoryGrid" class="grid"></div></div>
</section>
</main>
<script>
const R=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const KEY='pokerRangeTrainer_v1';
let ranges=JSON.parse(localStorage.getItem(KEY)||'[]'), current={id:null,name:'',hands:{}}, selected='Raise', q=null, memoryAction='Raise', memoryAnswers={};

function hands(){let a=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)a.push(i===j?R[i]+R[j]:i<j?R[i]+R[j]+'s':R[j]+R[i]+'o');return a}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='home')renderList();if(id==='quiz'||id==='memory')fillSelects()}
function newRange(){current={id:null,name:'',hands:{}};document.getElementById('rangeName').value='';selected='Raise';document.getElementById('selectedAction').textContent=selected;renderEditor();show('editor')}
function setAction(a){selected=a;document.getElementById('selectedAction').textContent=a}
function renderEditor(){let g=document.getElementById('editorGrid');g.innerHTML='';hands().forEach(h=>{let b=document.createElement('button');b.className='cell '+(current.hands[h]||'');b.textContent=h;b.onclick=()=>{current.hands[h]=selected;renderEditor()};g.appendChild(b)})}
function saveRange(){let n=document.getElementById('rangeName').value.trim();if(!n)return alert('レンジ名を入力してください');current.name=n;if(!current.id)current.id=Date.now().toString();let i=ranges.findIndex(x=>x.id===current.id);if(i>=0)ranges[i]=JSON.parse(JSON.stringify(current));else ranges.push(JSON.parse(JSON.stringify(current)));localStorage.setItem(KEY,JSON.stringify(ranges));alert('保存しました');show('home')}
function renderList(){let d=document.getElementById('rangeList');if(!ranges.length){d.textContent='まだ保存されたレンジはありません。';return}d.innerHTML='';ranges.forEach(r=>{let x=document.createElement('div');x.className='card';x.innerHTML='<b>'+escapeHTML(r.name)+'</b> ';let e=button('編集',()=>{current=JSON.parse(JSON.stringify(r));document.getElementById('rangeName').value=current.name;renderEditor();show('editor')});let q=button('クイズ',()=>{show('quiz');document.getElementById('quizRange').value=r.id;startQuiz()});let ren=button('名前変更',()=>{let n=prompt('新しい名前',r.name);if(n){r.name=n;localStorage.setItem(KEY,JSON.stringify(ranges));renderList()}});let del=button('削除',()=>{if(confirm('削除しますか？')){ranges=ranges.filter(x=>x.id!==r.id);localStorage.setItem(KEY,JSON.stringify(ranges));renderList()}});x.append(e,q,ren,del);d.appendChild(x)})}
function button(t,fn){let b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;return b}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillSelects(){for(const id of ['quizRange','memoryRange']){let s=document.getElementById(id),v=s.value;s.innerHTML=ranges.length?'':'<option value="">保存済みレンジなし</option>';ranges.forEach(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=r.name;s.appendChild(o)});if(v)s.value=v}}
function getRange(id){return ranges.find(r=>r.id===id)}
function startQuiz(){let r=getRange(document.getElementById('quizRange').value);if(!r){document.getElementById('quizArea').classList.add('hidden');return}document.getElementById('quizArea').classList.remove('hidden');document.getElementById('quizEmpty').textContent='';q={range:r};nextQuestion()}
function nextQuestion(){let h=hands().filter(h=>q.range.hands[h]);if(!h.length){document.getElementById('quizHand').textContent='このレンジには設定済みハンドがありません';return}q.hand=h[Math.floor(Math.random()*h.length)];q.done=false;document.getElementById('quizHand').textContent=q.hand;document.getElementById('result').textContent='';document.getElementById('nextBtn').classList.add('hidden')}
function answer(a){if(!q||q.done)return;q.done=true;let correct=q.range.hands[q.hand];let ok=a===correct;document.getElementById('result').textContent=(ok?'✅ 正解！':'❌ 不正解。正しいアクション：'+correct);document.getElementById('nextBtn').classList.remove('hidden')}
function setMemoryAction(a){memoryAction=a}
function startMemory(){memoryAnswers={};document.getElementById('memoryResult').textContent='';let g=document.getElementById('memoryGrid');g.innerHTML='';hands().forEach(h=>{let b=document.createElement('button');b.className='cell';b.textContent=h;b.onclick=()=>{memoryAnswers[h]=memoryAction;b.textContent=h+'\n'+memoryAction;b.className='cell '+memoryAction};g.appendChild(b)})}
function checkMemory(){let r=getRange(document.getElementById('memoryRange').value);if(!r)return;let correct=0,total=169;let cells=[...document.querySelectorAll('#memoryGrid .cell')];hands().forEach((h,i)=>{let expected=r.hands[h]||'';let actual=memoryAnswers[h]||'';cells[i].classList.remove('correct','wrong');if(actual===expected){correct++;cells[i].classList.add('correct')}else{cells[i].classList.add('wrong');cells[i].title='正解：'+(expected||'未設定')}});document.getElementById('memoryResult').textContent='正答率：'+correct+' / '+total+'（'+(correct/total*100).toFixed(1)+'%） ※未設定マスも答えとして判定'}
renderList();
</script></body></html>
